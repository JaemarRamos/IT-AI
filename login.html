<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITMS — Sign In</title>
    <link rel="stylesheet" href="src/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/itms_baby/PNG/ITMS 16PX N.png" />
  </head>
  <body class="login-body">

    <div class="login-page">

      <!-- decorative side strip -->
      <div class="login-strip"></div>

      <div class="login-card">
        <div class="login-logo">
          <div class="logo-icon">
            <img src="/itms_baby/PNG/ITMS 120PX N.png" alt="ITMS" width="28" />
          </div>
          <div class="logo-title">ITMS</div>
          <div class="logo-sub">IT Security Training System</div>
        </div>

        <div style="display:flex;justify-content:center;margin-bottom:1.5rem;">
          <div class="badge">
            <div class="badge-dot"></div>
            System Online
          </div>
        </div>

        <div class="login-divider"></div>

        <div class="form-group">
          <label class="form-label">Employee ID or Email</label>
          <input class="form-input" type="text" id="email" placeholder="e.g. 10001 or admin@itms.com" autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <div class="forgot"><a href="#">Forgot password?</a></div>

        <p id="error-msg"></p>
        <button class="login-btn" id="login-btn">Sign in</button>

        <div class="login-footer">
          ITMS v1.0 &nbsp;·&nbsp; Internal Use Only
        </div>
      </div>
    </div>

    <script type="module" src="src/login.js"></script>
  </body>
</html>
