<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITMS — Login</title>
    <link rel="stylesheet" href="src/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="public/itms_baby/PNG/ITMS 16PX N.png" />
  </head>
  <body class="login-body">

    <div class="login-page">
      <div class="glow-orb"></div>
      <div class="glow-orb2"></div>

      <div class="login-card">
        <div class="login-logo">
          <div class="logo-icon">
            <img src="public/itms_baby/PNG/ITMS 120PX N.png" alt="ITMS" width="28" />
          </div>
          <div class="logo-title">ITMS</div>
          <div class="logo-sub">Security Policy Quiz System</div>
        </div>

        <div style="display:flex; justify-content:center; margin-bottom:1.5rem;">
          <div class="badge">
            <div class="badge-dot"></div>
            System Online
          </div>
        </div>

        <div class="login-divider"></div>

        <div class="form-group">
          <label class="form-label">Employee ID</label>
          <input class="form-input" type="text" id="email" placeholder="admin@ITMS.com" />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••" />
        </div>

        <div class="forgot"><a href="#">Forgot password?</a></div>

        <p id="error-msg"></p>
        <button class="login-btn" id="login-btn">Sign in</button>

        <div class="login-footer">
          ITMS v1.0 &nbsp;·&nbsp; Internal Use Only
        </div>
      </div>
    </div>
    <script type="module" src="src/login.js"></script>
  </body>
</html>
