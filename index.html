<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITMS</title>
    <link rel="stylesheet" href="src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="src/assets/itms_baby/PNG/ITMS 16PX N.png" />
  </head>
  <body>
    <div class="layout">

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">Modules</span>
          <button class="close-btn" id="close-btn" title="Close sidebar">&#x2715;</button>
        </div>

        <div class="sidebar-section">
          <div class="section-label">IT Policies</div>
          <div class="module-item active">
            <div class="module-dot"></div>
            <span class="module-name">Security & Access</span>
            <span class="module-badge">5 Q</span>
          </div>
          <div class="module-item">
            <div class="module-dot"></div>
            <span class="module-name">Data Protection</span>
            <span class="module-badge">5 Q</span>
          </div>
          <div class="module-item">
            <div class="module-dot"></div>
            <span class="module-name">Device Usage</span>
            <span class="module-badge">5 Q</span>
          </div>
          <div class="module-item">
            <div class="module-dot"></div>
            <span class="module-name">Remote Work</span>
            <span class="module-badge">5 Q</span>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="section-label">Upload Policy</div>
          <button class="upload-doc-btn">&#x2B06; Upload document</button>
          <div class="upload-hint">PDF, DOCX, TXT supported</div>
        </div>

        <div class="sidebar-footer">
          <div class="sidebar-version">ITMS v1.0</div>
        </div>
      </aside>

      <div class="main" id="main">
        <header class="app-header">
          <div class="header-left">
            <button class="open-btn hidden" id="open-btn" title="Open sidebar">&#9776;</button>
          <div class="title-group">
            <img src="src/assets/itms_baby/PNG/ITMS 64PX N.png" alt="ITMS" class="ITMS-icon-img" />
            <div>
              <h1>ITMS</h1>
              <div class="header-sub">Security protocol quiz</div>
            </div>
          </div>
          <div class="progress-group">
            <span id="progress-label">Question 1 of 5</span>
            <span id="score-label">Score: 0</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </header>

        <main class="main-content">
          <section id="chat" class="chat-section"></section>

          <div id="input-section" class="input-section">
            <div id="ready-section" class="ready-section">
              <button id="ready-btn" class="submit-btn">
                I'm ready, start the quiz!
              </button>
            </div>
            <form id="quiz-form" class="quiz-form hidden">
              <div class="input-wrapper">
                <textarea
                  id="user-input"
                  placeholder="Type your answer here..."
                ></textarea>
              </div>
              <button type="submit" id="submit-btn" class="submit-btn">
                Submit
              </button>
            </form>
          </div>

          <div id="result-section" class="result-section hidden">
            <div class="score-card">
              <div id="final-score" class="final-score">0/5</div>
              <div class="score-label">IT Policy Quiz Complete</div>
            </div>
            <button id="restart-btn" class="restart-btn">Start over</button>
          </div>
        </main>
      </div>

      <div id="blur-overlay">
        <div class="blur-message">
          <span class="blur-icon">⚠️</span>
          <p>Quiz Paused</p>
          <small>Please return to the quiz window to continue</small>
        </div>
      </div>

    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
